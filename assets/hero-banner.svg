<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="420" fill="none">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="50%" stop-color="#0D1322"/>
      <stop offset="100%" stop-color="#05080F"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="indigoCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <radialGradient id="glowTop" cx="50%" cy="10%" r="60%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#0D1322" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowBottom" cx="80%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>

    <!-- CSS Animation Keyframes -->
    <style>
      .pulse-slow {
        animation: pulseGlow 6s ease-in-out infinite;
      }
      .dash-flow {
        stroke-dasharray: 8 6;
        animation: dashOffset 20s linear infinite;
      }
      .tag-glow {
        animation: tagPulse 4s ease-in-out infinite alternate;
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.04); }
      }
      @keyframes dashOffset {
        to { stroke-dashoffset: -200; }
      }
      @keyframes tagPulse {
        0% { stroke-opacity: 0.2; }
        100% { stroke-opacity: 0.7; }
      }
    </style>
  </defs>

  <!-- Deep Obsidian Background -->
  <rect width="1200" height="420" rx="20" fill="url(#bgGrad)"/>
  <rect width="1200" height="420" rx="20" fill="url(#gridPattern)"/>

  <!-- Ambient Glow Layers -->
  <circle cx="600" cy="80" r="340" fill="url(#glowTop)" class="pulse-slow"/>
  <circle cx="950" cy="320" r="260" fill="url(#glowBottom)" class="pulse-slow"/>

  <!-- Outer Border Frame -->
  <rect x="2" y="2" width="1196" height="416" rx="18" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.5"/>

  <!-- Top Decorative Tech Accents -->
  <line x1="80" y1="45" x2="280" y2="45" stroke="#6366F1" stroke-opacity="0.4" stroke-width="1" class="dash-flow"/>
  <circle cx="80" cy="45" r="3" fill="#6366F1"/>
  <line x1="920" y1="45" x2="1120" y2="45" stroke="#06B6D4" stroke-opacity="0.4" stroke-width="1" class="dash-flow"/>
  <circle cx="1120" cy="45" r="3" fill="#06B6D4"/>

  <!-- Kicker Pill Badge -->
  <g transform="translate(460, 55)">
    <rect width="280" height="30" rx="15" fill="#1E293B" fill-opacity="0.6" stroke="#6366F1" stroke-opacity="0.4" stroke-width="1" class="tag-glow"/>
    <circle cx="20" cy="15" r="4" fill="#10B981"/>
    <text x="34" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#94A3B8" letter-spacing="1.5">AUTONOMOUS COGNITIVE SUITE</text>
  </g>

  <!-- Main Headline Title -->
  <g transform="translate(600, 160)" text-anchor="middle">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Outfit', sans-serif" font-size="52" font-weight="900" fill="url(#textGrad)" letter-spacing="-1.5">
      AI STUDY BUDDY<tspan fill="#6366F1" font-size="34" font-weight="600" dy="-20">®</tspan>
    </text>
  </g>

  <!-- Subtitle Tagline -->
  <g transform="translate(600, 215)" text-anchor="middle">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" fill="#94A3B8" letter-spacing="0.2">
      Autonomous Knowledge Synthesis · 3D Spaced Repetition · Socratic Mentorship
    </text>
  </g>

  <!-- Accent Divider Line with Center Diamond -->
  <g transform="translate(400, 250)">
    <line x1="0" y1="0" x2="180" y2="0" stroke="url(#indigoCyan)" stroke-width="1.5" stroke-opacity="0.6"/>
    <polygon points="200,-5 205,0 200,5 195,0" fill="#06B6D4"/>
    <line x1="220" y1="0" x2="400" y2="0" stroke="url(#indigoCyan)" stroke-width="1.5" stroke-opacity="0.6"/>
  </g>

  <!-- Bottom Interactive Capability Pills -->
  <g transform="translate(130, 310)">
    <!-- Pill 1: Socratic AI Tutor -->
    <g transform="translate(0, 0)">
      <rect width="170" height="42" rx="21" fill="#0F172A" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
      <circle cx="22" cy="21" r="5" fill="#6366F1"/>
      <text x="38" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#E2E8F0">Socratic AI Tutor</text>
    </g>

    <!-- Pill 2: 3D Flashcards -->
    <g transform="translate(190, 0)">
      <rect width="175" height="42" rx="21" fill="#0F172A" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
      <circle cx="22" cy="21" r="5" fill="#8B5CF6"/>
      <text x="38" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#E2E8F0">3D Flashcards</text>
    </g>

    <!-- Pill 3: Adaptive Quizzes -->
    <g transform="translate(385, 0)">
      <rect width="180" height="42" rx="21" fill="#0F172A" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
      <circle cx="22" cy="21" r="5" fill="#06B6D4"/>
      <text x="38" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#E2E8F0">Adaptive Quizzing</text>
    </g>

    <!-- Pill 4: Pomodoro Engine -->
    <g transform="translate(585, 0)">
      <rect width="175" height="42" rx="21" fill="#0F172A" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
      <circle cx="22" cy="21" r="5" fill="#10B981"/>
      <text x="38" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#E2E8F0">Pomodoro Engine</text>
    </g>

    <!-- Pill 5: Spaced Analytics -->
    <g transform="translate(780, 0)">
      <rect width="160" height="42" rx="21" fill="#0F172A" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
      <circle cx="22" cy="21" r="5" fill="#F59E0B"/>
      <text x="38" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#E2E8F0">Study Analytics</text>
    </g>
  </g>
</svg>
